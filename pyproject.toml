[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lagrl"
version = "0.1.0"
description = "CPU-only scaffolding for learning to build an asynchronous RL runtime"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["grpcio>=1.81.1,<2", "protobuf>=6.33.5,<7", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
training = ["torch>=2.6,<3"]

[project.scripts]
lagrl = "lagrl.cli:main"

[dependency-groups]
dev = ["grpcio-tools>=1.81.1,<1.82", "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/scaffold"]
asyncio_mode = "auto"
markers = ["training: requires optional CPU PyTorch environment", "isolation: requires opt-in gVisor runtime", "gpu: requires opt-in GPU environment"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/lagrl/sandbox/proto/*_pb2*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/lagrl"]
